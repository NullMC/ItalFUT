<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b24" />
    <meta name="description" content="ItalFUT: la piattaforma per gestire competizioni, squadre, calendari, risultati e classifiche. Ogni torneo ha il suo spazio." />
    <title>ItalFUT — Il tuo torneo, tutto in campo.</title>
  <script>
      try {
        const value = localStorage.getItem('italfut-appearance');
        document.documentElement.dataset.theme = value === 'dark' || value === 'light'
          ? value
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
